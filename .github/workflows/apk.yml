name: Gerar APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar o app
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Preparar o APK
        run: cp android/app/build/outputs/apk/release/app-release.apk EditorJota.apk

      - name: Publicar pra baixar no celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: Editor Jota v1.0.${{ github.run_number }}
          make_latest: true
          files: EditorJota.apk
          body: |
            Baixe o **EditorJota.apk** abaixo e instale no celular.
            Se for a primeira vez, siga as instruções que aparecem ao abrir o app.
