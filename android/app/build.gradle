plugins { id 'com.android.application' }

android {
    namespace 'com.jota.editor'
    compileSdk 34
    defaultConfig {
        applicationId 'com.jota.editor'
        minSdk 24
        targetSdk 34
        versionCode ((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }
    signingConfigs {
        jota {
            storeFile file('jota.keystore')
            storePassword 'jotaeditor'
            keyAlias 'jota'
            keyPassword 'jotaeditor'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.jota
        }
        debug { signingConfig signingConfigs.jota }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
